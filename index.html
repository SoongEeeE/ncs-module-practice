<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>한전 NCS 의사소통 어휘 훈련</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f5f7fb;color:#18212f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:760px;margin:auto;padding:20px 16px 48px}.hero{background:#111827;color:#fff;border-radius:22px;padding:24px 20px;margin-bottom:16px}
.hero h1{font-size:24px;margin:0 0 8px}.hero p{margin:0;color:#cbd5e1;font-size:14px;line-height:1.6}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 12px #00000008}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#64748b;font-size:13px}
.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;background:#111827;width:0;transition:.2s}
.q{font-size:17px;line-height:1.75;margin:0 0 18px}.blank{font-weight:700;text-decoration:underline;text-underline-offset:5px}
.options{display:grid;gap:9px}.opt{border:1px solid #dbe1ea;background:#fff;border-radius:12px;padding:13px 14px;text-align:left;font-size:15px;cursor:pointer}.opt:active{transform:scale(.99)}
.opt.correct{border-color:#16a34a;background:#f0fdf4}.opt.wrong{border-color:#dc2626;background:#fef2f2}.opt.disabled{cursor:default}
.result{display:none;margin-top:18px;padding:15px;border-radius:13px;background:#f8fafc;line-height:1.7}.result.show{display:block}.hanja{font-size:20px;font-weight:800}.meaning{color:#334155}.note{font-size:13px;color:#64748b;margin-top:5px}
.actions{display:flex;gap:9px;margin-top:16px}.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer}.primary{background:#111827;color:white}.secondary{background:#eef2f7;color:#111827}
.source{font-size:12px;color:#64748b;margin-top:18px;line-height:1.6}
.score{font-size:20px;font-weight:800}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>한전 NCS 의사소통 · 어휘 훈련</h1><p>문맥에 맞는 어휘를 고르고, 정답 확인 후 한자와 뜻까지 복습하세요.</p></section>
<div class="card">
  <div class="top"><span id="count">1 / 20</span><span id="score">점수 0</span></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <p class="q" id="question"></p>
  <div class="options" id="options"></div>
  <div class="result" id="result"></div>
  <div class="actions">
    <button class="btn secondary" id="next" disabled>다음 문제</button>
  </div>
</div>
<div class="card hidden" id="finish">
  <div class="score" id="final"></div>
  <p>틀린 단어는 아래에서 다시 복습할 수 있어요.</p>
  <button class="btn primary" id="restart">다시 풀기</button>
</div>
<div class="source">※ 어휘 뜻과 한자는 국어 사전 확인을 위한 학습용 정리입니다. 실제 시험에서는 문맥 전체를 기준으로 판단하세요.</div>
</div>
<script>
const words={
"개진하다":{h:"開陳하다",m:"생각이나 의견을 말이나 글로 드러내다."},
"간과하다":{h:"看過하다",m:"큰 관심 없이 대강 보고 그냥 넘기다."},
"귀추":{h:"歸趨",m:"일이 되어 가는 형편이나 앞으로의 결과."},
"답습하다":{h:"踏襲하다",m:"예로부터 해 오던 방식이나 절차를 그대로 따르다."},
"도외시하다":{h:"度外視하다",m:"상관하지 않고 무시하다."},
"방증":{h:"傍證",m:"직접 증명하지는 않지만 주변 자료 등을 통해 사실을 뒷받침하는 증거."},
"부합하다":{h:"符合하다",m:"서로 들어맞다."},
"상충하다":{h:"相衝하다",m:"서로 맞지 않고 어긋나거나 충돌하다."},
"소명하다":{h:"疏明하다",m:"사정이나 이유를 알아내어 설명하다."},
"수렴하다":{h:"收斂하다",m:"의견이나 생각 등을 한데 모으다."},
"유예하다":{h:"猶豫하다",m:"일을 실행하는 시기를 늦추거나 미루다."},
"천착하다":{h:"穿鑿하다",m:"어떤 원인이나 내용을 깊이 파고들어 연구하다."},
"함의하다":{h:"含意하다",m:"말이나 글 속에 뜻을 포함하다."},
"호도하다":{h:"糊塗하다",m:"사실을 흐려 분명하지 않게 만들다."},
"견지하다":{h:"堅持하다",m:"어떤 입장이나 태도를 굳게 지니다."},
"일축하다":{h:"一蹴하다",m:"제안이나 주장을 단번에 물리치거나 받아들이지 않다."},
"타개하다":{h:"打開하다",m:"어려운 일을 잘 처리하여 해결의 실마리를 열다."},
"환기하다":{h:"喚起하다",m:"주의나 관심 등을 불러일으키다."},
"통찰":{h:"洞察",m:"사물이나 현상을 꿰뚫어 보는 것."},
"갈음하다":{h:"—",m:"다른 것으로 대신하다."}
};

const qs=[
["회의에서 각 부서의 의견을 충분히 ___한 뒤 최종안을 마련했다.",["수렴하다","도외시하다","호도하다","일축하다"],0],
["기존의 성공 사례를 그대로 ___하기보다 우리 조직의 상황에 맞게 수정했다.",["천착하다","답습하다","개진하다","환기하다"],1],
["정책의 효과를 판단할 때 단기적인 수치만 보아 장기적인 영향을 ___해서는 안 된다.",["간과하다","소명하다","갈음하다","부합하다"],0],
["두 사업의 목표가 서로 ___하여 예산 배분 과정에서 조정이 필요했다.",["상충하다","환기하다","수렴하다","개진하다"],0],
["그 자료는 직접적인 증거는 아니지만 주장을 뒷받침하는 ___로 볼 수 있다.",["귀추","방증","함의","갈음"],1],
["위원회는 새로운 방안을 ___했지만, 구체적인 실행계획은 아직 마련되지 않았다.",["개진하다","유예하다","간과하다","호도하다"],0],
["사업 일정은 예산 사정으로 한 달 ___되었다.",["유예하다","천착하다","견지하다","환기하다"],0],
["문제의 원인을 단순히 개인의 실수로 보지 말고 구조적 원인까지 ___해야 한다.",["천착하다","일축하다","갈음하다","도외시하다"],0],
["보고서의 결론은 실제 조사 결과와 대체로 ___했다.",["부합하다","호도하다","상충하다","일축하다"],0],
["정책의 긍정적인 효과만 강조해 부작용을 숨기는 것은 사실을 ___하는 태도다.",["호도하다","수렴하다","견지하다","소명하다"],0],
["안전 문제에 대한 시민들의 관심을 ___하기 위해 캠페인을 실시했다.",["환기하다","답습하다","유예하다","천착하다"],0],
["기관은 기존 입장을 계속 ___하면서도 새로운 의견을 검토하기로 했다.",["견지하다","갈음하다","방증하다","호도하다"],0],
["회의에서 제기된 우려를 근거 없이 ___하지 말고 자료를 확인해야 한다.",["일축하다","수렴하다","개진하다","환기하다"],0],
["감사 과정에서 담당자는 사업 지연의 사유를 구체적으로 ___했다.",["소명하다","답습하다","상충하다","갈음하다"],0],
["이번 통계는 인구 감소가 지속되고 있다는 사실을 보여 주는 중요한 ___을 제공한다.",["방증","귀추","유예","답습"],0],
["최종 결정의 ___가 어떻게 될지는 추가 협의 결과에 달려 있다.",["귀추","함의","통찰","소명"],0],
["그 발언에는 조직문화 개선이 필요하다는 의미가 ___되어 있다.",["함의하다","유예하다","일축하다","답습하다"],0],
["현행 절차를 다른 서류로 ___할 수 있는지 검토했다.",["갈음하다","천착하다","견지하다","환기하다"],0],
["데이터를 통해 현상의 원인과 구조를 꿰뚫어 보는 능력을 ___이라고 한다.",["통찰","귀추","방증","유예"],0],
["새로운 사업은 주민들의 요구와 정책 방향에 ___하도록 설계했다.",["부합하다","도외시하다","호도하다","답습하다"],0]
];

let order=[],idx=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){order=shuffle(qs);idx=0;score=0;answered=false;$("finish").classList.add("hidden");render()}
function render(){
 if(idx>=order.length){$("finish").classList.remove("hidden");$("final").textContent=`최종 점수 ${score} / ${order.length}`;return}
 answered=false;$("next").disabled=true;$("result").className="result";
 const [q,opts,ans]=order[idx];$("count").textContent=`${idx+1} / ${order.length}`;$("score").textContent=`점수 ${score}`;$("bar").style.width=`${idx/order.length*100}%`;
 $("question").textContent=q;$("options").innerHTML="";
 opts.forEach((o,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=`${i+1}. ${o}`;b.onclick=()=>choose(i,b,opts,ans);$("options").appendChild(b)})
}
function choose(i,btn,opts,ans){
 if(answered)return;answered=true;
 [...$("options").children].forEach(b=>b.classList.add("disabled"));
 const word=opts[ans];const ok=i===ans;if(ok)score++;
 btn.classList.add(ok?"correct":"wrong");
 if(!ok)$("options").children[ans].classList.add("correct");
 const w=words[word];
 $("result").className="result show";
 $("result").innerHTML=`<b>${ok?"정답입니다!":"오답입니다."}</b><br><span class="hanja">${word} ${w.h}</span><br><span class="meaning">${w.m}</span>${!ok?`<div class="note">정답: ${ans+1}번 ${word}</div>`:""}<div class="note">문맥에서 어떤 의미로 쓰였는지 함께 확인하세요.</div>`;
 $("score").textContent=`점수 ${score}`;$("next").disabled=false;
}
$("next").onclick=()=>{idx++;render()};$("restart").onclick=start;start();
</script>
</body></html>
