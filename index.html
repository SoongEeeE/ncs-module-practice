<style>
:root{color-scheme:light;--ink:#18243b;--muted:#63718a;--line:#dfe5ef;--blue:#435bd4;--pale:#eef1ff;--green:#18794e;--red:#ad3645;--bg:#f4f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}button,select{font:inherit}button{touch-action:manipulation;cursor:pointer}.wrap{max-width:900px;margin:auto;padding:16px 14px 40px}.top,.line,.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px}.top{margin:2px 0 14px}.brand{font-weight:850}.badge{font-size:12px;font-weight:800;color:#344dc3;background:#e7ebff;padding:6px 10px;border-radius:30px}.hero{background:linear-gradient(125deg,#283d9f,#687ce8);color:#fff;border-radius:20px;padding:22px;box-shadow:0 12px 28px #2d43aa24}.hero h1{font-size:clamp(22px,5vw,30px);line-height:1.3;margin:0 0 8px}.hero p{font-size:13px;color:#edf0ff;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{padding:9px 10px;border:1px solid #ffffff30;background:#ffffff19;border-radius:12px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:#e4e9ff}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 4px 14px #25355208}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:9px}.control{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}.progress{margin:14px 0 17px}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:6px}.track{height:8px;background:#e1e6ef;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:var(--blue);transition:width .2s}.qmeta{font-size:12px;color:var(--muted);font-weight:750}.qtitle{font-size:18px;line-height:1.55;font-weight:850;margin:14px 0 16px;white-space:pre-line}.data{margin:10px 0 14px;border:1px solid #e3e8f2;border-radius:12px;padding:12px;background:#f8f9fc;overflow-x:auto;font-size:13px}.data table{border-collapse:collapse;width:100%;min-width:320px}.data th,.data td{padding:7px 9px;border-bottom:1px solid #e3e8f2;text-align:left}.answers{display:grid;gap:8px}.answer{width:100%;text-align:left;display:flex;align-items:flex-start;gap:10px;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);line-height:1.5;min-height:46px}.answer:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #8e9df4;outline-offset:2px}.n{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;background:#eef1f6;font-size:12px;font-weight:850}.answer.good{background:#effaf4;border-color:#70bd95}.answer.good .n{background:#d8f1e3;color:var(--green)}.answer.bad{background:#fff2f3;border-color:#df9aa2}.answer.bad .n{background:#ffe0e3;color:var(--red)}.answer:disabled{cursor:default}.feedback{margin-top:13px;padding:13px;border-radius:12px;border:1px solid var(--line);background:#f8f9fc}.feedback.ok{background:#effaf4;border-color:#b9e3c9}.feedback.no{background:#fff3f4;border-color:#f0c3c8}.result{font-size:15px;font-weight:850}.result.ok{color:var(--green)}.result.no{color:var(--red)}.explains{display:grid;gap:8px;margin-top:10px}.explain{font-size:12px;color:#465168;padding-left:9px;border-left:2px solid #d9deeb}.explain b{color:var(--ink)}.actions{display:flex;gap:8px;margin-top:13px}.primary,.secondary{border:0;border-radius:11px;padding:11px 14px;font-weight:800;min-height:44px}.primary{background:var(--blue);color:#fff;flex:1}.secondary{background:#edf0f6;color:#44516a}.empty{text-align:center;padding:26px 10px}.small,.foot{font-size:11px;color:var(--muted)}.foot{text-align:center;margin-top:18px}.hide{display:none!important}@media(max-width:520px){.wrap{padding:11px 11px 28px}.hero{padding:18px;border-radius:17px}.card{padding:13px}.qtitle{font-size:17px}.toolbar{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:8px}.stat b{font-size:17px}.answer{padding:11px 10px}}
</style>

<body><main class="wrap">
<header class="top"><div class="brand">📘 NCS 모듈형 연습실</div><span class="badge">4개 영역 · 100문항</span></header>
<section class="hero"><h1>개념을 실제 업무에 적용해 보세요</h1><p>직업기초능력 학습목표를 바탕으로 새로 구성한 예상 연습문제입니다. 정답을 고르면 네 선지 모두의 해설을 확인할 수 있습니다.</p><div class="stats"><div class="stat"><b id="score">0</b><span>누적 정답</span></div><div class="stat"><b id="accuracy">—</b><span>누적 정답률</span></div><div class="stat"><b id="remaining">0</b><span>현재 범위</span></div></div></section>
<section class="progress"><div class="progress-head"><span id="progressText">진행 상황</span><span id="progressCount">0 / 0</span></div><div class="track"><div class="fill" id="fill"></div></div></section>
<section class="card"><div class="toolbar"><select class="control" id="area" aria-label="영역 선택"><option value="all">전체 영역</option></select><select class="control" id="mode" aria-label="문제 모드"><option value="all">전체 문제</option><option value="wrong">오답 문제 복습</option></select></div><p class="small" id="modeHint">한 문항씩 풀고 해설을 확인하세요. 기록은 이 기기에 저장됩니다.</p></section>
<section class="card" id="quiz" aria-live="polite"></section>
<section class="card line"><span class="small">기록은 이 브라우저에만 저장됩니다.</span><button class="secondary" id="reset">기록 초기화</button></section>
<p class="foot">본 문제는 학습 연습용으로 새로 작성했으며, 실제 시험문제나 공식 출제문항이 아닙니다.</p>
</main>
<script>
const BANK=[
{a:'의사소통능력',t:'[상황판단] 납품 일정 변경을 전화로 전달받았다. 상대는 “금요일까지는 가능하다”고 했지만, 오전인지 업무 종료 전인지 분명하지 않다. 후속 업무 오류를 줄이는 대응은?',o:['“금요일”이라고만 메모하고 통화를 끝낸다','마감 시각과 변경 대상, 적용할 주문을 되짚어 확인한 뒤 기록한다','상대가 바쁠 수 있으므로 기존 일정을 그대로 적용한다','동료에게 전달받은 내용을 추측해 공유한다'],c:1,e:['날짜 표현만 기록하면 마감 시각과 대상 주문이 불명확하게 남습니다.','핵심 조건을 요약해 상대에게 확인하고 기록하면 의미를 상호 검증하고 누락을 줄일 수 있습니다.','변경 통보를 확인했으므로 기존 일정을 유지하면 업무 정보가 서로 달라집니다.','추측을 전달하면 확인되지 않은 정보가 사실처럼 확산됩니다.']},
{a:'의사소통능력',t:'[문서이해] 다음은 고객 불만 접수 현황이다. 팀장은 “이번 주 재접수율을 낮출 첫 조치”를 요청했다. 자료에서 직접 뒷받침되는 조치는?',d:'<table><tr><th>유형</th><th>접수</th><th>재접수</th><th>주요 메모</th></tr><tr><td>배송 지연</td><td>40</td><td>12</td><td>예정일 안내 누락 9건</td></tr><tr><td>제품 문의</td><td>30</td><td>3</td><td>설명서 위치 문의 2건</td></tr><tr><td>결제 오류</td><td>20</td><td>4</td><td>중복 결제 확인 요청</td></tr></table>',o:['재접수 비중이 큰 배송 지연 유형에서 예정일 안내 절차를 우선 점검한다','접수가 가장 적은 결제 오류부터 전면 개편한다','제품 문의가 가장 많다고 보고 제품을 교체한다','세 유형의 원인이 같다고 보고 모든 상담을 통합한다'],c:0,e:['배송 지연 재접수 12건 중 안내 누락이 9건이라는 메모가 있어 안내 절차 점검이 자료에 근거한 우선 조치입니다.','결제 오류는 접수와 재접수가 가장 적고, 자료만으로 전면 개편 필요성을 알 수 없습니다.','표에는 제품 결함이나 교체 요구가 제시되지 않았습니다.','유형별 재접수 원인은 서로 다르게 나타나며 동일 원인이라는 근거가 없습니다.']},
{a:'의사소통능력',t:'[개념비교] 팀장이 여러 부서의 의견을 모아 일정안을 확정하려 한다. 회의 진행자는 결론을 대신 정하지 않고 참여자들의 논의를 돕는다. 진행자의 역할로 가장 알맞은 것은?',o:['퍼실리테이터로서 쟁점을 정리하고 합의 형성을 촉진한다','의사결정권자로서 논의 전에 정답을 발표한다','기록 담당자로서 발언을 평가해 찬반을 결정한다','중재자 역할을 피하고 가장 직급이 높은 의견만 남긴다'],c:0,e:['퍼실리테이터는 집단이 문제를 이해하고 효과적으로 의사결정하도록 과정과 참여를 촉진합니다.','결론을 미리 정해 강요하면 참여자 스스로의 논의와 합의를 막습니다.','기록은 회의 지원 업무일 수 있지만 발언의 옳고 그름을 대신 결정하는 것은 아닙니다.','직급만으로 의견을 선택하면 쟁점과 근거를 검토하지 못합니다.']},
{a:'의사소통능력',t:'[상황판단] 동료의 보고서에 핵심 수치가 빠져 있어 수정이 필요하다. 관계를 해치지 않으면서 개선을 요청하는 말은?',o:['“보고서를 늘 이렇게 작성하시네요. 기본부터 다시 하세요.”','“수고하셨습니다. 다만 3쪽의 기준 수치가 없어 비교가 어렵습니다. 원자료를 확인해 추가해 주실 수 있을까요?”','“괜찮습니다.”라고 한 뒤 상사에게만 불만을 말한다','보고서의 모든 부분을 칭찬한 뒤 수정할 점은 언급하지 않는다'],c:1,e:['사람을 평가하고 일반화하는 표현은 구체적인 수정 행동을 안내하지 못합니다.','관찰 가능한 위치와 문제, 업무 영향, 요청 행동을 구체적으로 전달해 상대가 수정할 수 있습니다.','당사자에게 필요한 피드백을 주지 않아 오류가 반복될 수 있습니다.','칭찬만 하고 핵심 수정사항을 숨기면 업무 목적을 달성하지 못합니다.']},
{a:'의사소통능력',t:'[자료해석] 공지문을 읽고 필요한 행동을 결정하려 한다. “신청은 6월 12일 17시까지, 신청 후 부서장 승인을 받아야 접수 완료”라고 적혀 있다. 6월 12일 16시에 신청서를 제출했지만 승인은 아직 받지 못했다. 가장 정확한 판단은?',o:['기한 전에 신청했으므로 접수 완료다','신청만으로는 완료가 아니며 승인까지 확인해야 한다','부서장 승인만 있으면 신청은 하지 않아도 된다','17시는 승인 완료 시각이 아니라 신청 시작 시각이다'],c:1,e:['공지에서 접수 완료 조건은 신청과 부서장 승인 모두입니다.','신청과 승인 두 조건을 모두 충족해야 완료이므로 승인 상태를 확인해야 합니다.','승인은 신청을 대신하지 않습니다.','17시는 신청 마감 시각으로 제시되어 있습니다.']},
{a:'의사소통능력',t:'[개념비교] 회의에서 상대방의 주장을 들으며 반박할 문장을 계속 준비한 나머지 핵심 조건을 놓쳤다. 이를 줄이는 방법은?',o:['상대의 발언을 끝까지 듣고 핵심을 요약해 확인한 뒤 의견을 말한다','상대보다 먼저 결론을 말해 대화 시간을 줄인다','동의하는 내용만 골라 듣고 나머지는 무시한다','상대의 표정만 보고 의도를 추정한다'],c:0,e:['끝까지 듣고 요약·확인하면 메시지를 정확히 이해한 뒤 대응할 수 있습니다.','먼저 결론을 말하면 정보 교환과 상호 이해를 막을 수 있습니다.','듣고 싶은 내용만 받아들이는 것은 걸러 듣기입니다.','표정만으로 의도를 단정하는 것은 짐작하기에 해당합니다.']},
{a:'의사소통능력',t:'[문서작성] 외부 협력사에 일정 변경을 공식 요청하는 문서를 작성한다. 가장 적절한 작성 원칙은?',o:['요청 목적, 변경 전후 일정, 회신 기한을 분명히 쓰고 정해진 결재 절차를 따른다','친밀감을 위해 사내 메신저의 줄임말을 그대로 사용한다','배경 설명을 길게 쓰되 요청사항과 기한은 생략한다','초안을 작성한 사람이 결재 여부와 관계없이 발송한다'],c:0,e:['대외 문서는 목적과 요청사항, 조건을 정확하고 간결하게 제시하고 조직의 절차를 따라야 합니다.','비공식 줄임말은 외부 수신자가 이해하기 어렵고 공식 문서에 적절하지 않습니다.','핵심 요청과 기한이 없으면 수신자가 무엇을 해야 하는지 알기 어렵습니다.','공식 문서는 권한과 결재 절차를 확인해야 합니다.']},
{a:'의사소통능력',t:'[상황판단] 고객이 기술 용어를 이해하지 못해 같은 질문을 반복한다. 설명 방식을 개선하는 가장 적절한 방법은?',o:['전문 용어를 더 정확히 반복한다','고객의 사용 상황에 맞는 쉬운 말과 짧은 단계로 다시 설명하고 이해 여부를 확인한다','질문을 멈추도록 설명서를 전달한다','고객이 이해하지 못한 책임을 고객에게 돌린다'],c:1,e:['용어를 반복해도 상대가 모르는 표현이라면 이해가 나아지지 않습니다.','수신자와 목적에 맞는 표현으로 바꾸고 확인하는 것이 효과적인 의사소통입니다.','설명서 전달만으로 이해 여부가 확인되는 것은 아닙니다.','상대 탓은 필요한 의미 전달과 문제 해결을 돕지 않습니다.']},
{a:'문제해결능력',t:'[자료해석] 포장 공정의 주간 불량 건수다. 관리자는 “가장 먼저 검증할 원인”을 찾고 있다. 자료가 뒷받침하는 선택은?',d:'<table><tr><th>조</th><th>생산량</th><th>불량</th><th>관찰 사항</th></tr><tr><td>A</td><td>500</td><td>10</td><td>교대 직후 검사 공백</td></tr><tr><td>B</td><td>500</td><td>20</td><td>교대 직후 검사 공백</td></tr><tr><td>C</td><td>250</td><td>10</td><td>검사 기록 정상</td></tr></table>',o:['B조의 불량률이 가장 높으므로 교대 직후 검사 공백이 불량과 관련 있는지 우선 확인한다','C조의 불량 건수가 10건이므로 C조가 가장 심각하다고 결론낸다','A조와 B조의 생산량이 같으므로 불량률 차이는 비교할 수 없다','자료만으로 검사 공백이 원인임이 입증됐으므로 다른 요인은 조사하지 않는다'],c:0,e:['A조 2%, B조 4%, C조 4%로 B조와 C조가 불량률이 높지만, 관찰 사항이 같은 A·B조를 비교하면 검사 공백 가설을 우선 검증할 수 있습니다.','건수만으로 비교하면 생산량 차이를 반영하지 못합니다.','같은 생산량이므로 A조와 B조의 비율은 직접 비교할 수 있고 차이는 2%p입니다.','관찰 자료는 원인을 확정하지 않습니다. 추가 검증이 필요합니다.']},
{a:'문제해결능력',t:'[문제유형] 현재 발생한 서버 접속 장애를 복구하는 일과, 내년 신규 고객층을 위한 서비스를 설계하는 일의 유형을 바르게 짝지은 것은?',o:['발생형 문제 — 설정형 문제','탐색형 문제 — 발생형 문제','설정형 문제 — 탐색형 문제','탐색형 문제 — 설정형 문제'],c:0,e:['이미 발생해 직접 해결해야 하는 장애는 발생형, 미래 목표와 과제를 설정하는 신규 서비스 설계는 설정형 문제입니다.','신규 서비스 설계는 이미 발생한 문제의 복구가 아닙니다.','장애 복구는 미래 목표 설정이 아닙니다.','현재 업무의 개선은 탐색형이지만 이미 발생한 장애 복구는 발생형입니다.']},
{a:'문제해결능력',t:'[상황판단] 민원 처리 시간이 늘었다. 팀은 곧바로 상담 인력을 늘리려 한다. 문제를 체계적으로 정의하기 위한 첫 단계로 가장 알맞은 것은?',o:['현재 처리시간과 목표 기준을 확인하고 차이가 커진 시점·유형을 구분한다','인력 증원을 먼저 실행한 뒤 결과를 추정한다','최근 가장 불친절했던 직원을 원인으로 지목한다','민원 내용 전체를 읽지 않고 평균만 보고 결론낸다'],c:0,e:['목표 상태와 실제 현상을 비교하고 어떤 조건에서 차이가 나타나는지 확인해야 문제를 정의할 수 있습니다.','해결안을 먼저 실행하면 원인과 효과를 분리하기 어렵습니다.','개인을 먼저 탓하면 근거를 바탕으로 원인을 분석하지 못합니다.','평균만으로는 유형별·시점별 차이를 놓칠 수 있습니다.']},
{a:'문제해결능력',t:'[개념비교] 팀은 “교육 부족”을 원인으로 가정했다. 교육을 받은 직원과 받지 않은 직원을 비교하고, 업무량·시스템 변경 여부도 확인하려 한다. 이 접근의 핵심은?',o:['가설을 세우되 자료로 검증하고 다른 설명도 함께 살핀다','가설을 세웠으므로 교육 부족을 사실로 확정한다','직원 경험만으로 원인을 결정하고 자료는 제외한다','원인 분석 대신 즉시 전 직원을 재교육한다'],c:0,e:['가설 지향 접근은 잠정 설명을 세우고 자료로 검증하며 결과에 따라 수정합니다.','가설은 검증 전의 설명이지 확정된 사실이 아닙니다.','경험은 가설 설정에 도움을 줄 수 있지만 객관적 자료를 대신하지 않습니다.','전면 재교육은 원인과 필요를 확인하기 전에 선택한 해결안입니다.']},
{a:'문제해결능력',t:'[자료해석] 세 가지 개선안의 조건을 비교했다. 납기 단축이 목표이고, 추가 예산은 100만 원 이하이다. 가장 적절한 안은?',d:'<table><tr><th>안</th><th>예상 단축</th><th>추가비용</th><th>위험</th></tr><tr><td>A</td><td>2일</td><td>70만 원</td><td>낮음</td></tr><tr><td>B</td><td>4일</td><td>140만 원</td><td>낮음</td></tr><tr><td>C</td><td>3일</td><td>90만 원</td><td>중간</td></tr></table>',o:['A안: 조건을 충족하며 위험이 낮다','B안: 가장 많이 단축하므로 예산 조건을 무시한다','C안: A안보다 단축이 크므로 위험과 비용을 고려하지 않는다','세 안은 모두 조건을 충족하므로 무작위로 고른다'],c:0,e:['A안은 예산 한도 안에 있고 위험이 낮아 제약조건을 안정적으로 충족합니다.','예상 단축은 크지만 비용이 한도를 초과합니다.','C안은 조건을 충족하지만 위험이 중간이며, 위험 선호도나 추가 기준 없이 A보다 무조건 우월하다고 할 수 없습니다.','B안은 비용 한도를 넘고, 세 대안의 위험도 같지 않습니다.']},
{a:'문제해결능력',t:'[전략적 사고] 한 부서의 처리량을 높이기 위해 검수 단계를 줄이면, 다음 부서의 재작업이 늘어날 수 있다. 실행 전에 무엇을 검토해야 하는가?',o:['부서 전체의 처리 흐름과 재작업·품질에 미치는 영향을 함께 살핀다','해당 부서의 처리량만 높아지면 성공으로 본다','다음 부서의 업무는 별개이므로 고려하지 않는다','검수 단계는 비용만 발생시키므로 즉시 제거한다'],c:0,e:['전략적 사고는 당면 조치와 더 큰 시스템, 관련 업무에 미치는 영향을 함께 고려합니다.','부분 성과만 보면 시스템 전체의 성과 악화를 놓칠 수 있습니다.','연결된 다음 단계의 영향은 해결안 평가에 포함해야 합니다.','검수의 기능과 위험을 확인하지 않고 제거하면 품질 문제가 생길 수 있습니다.']},
{a:'문제해결능력',t:'[상황판단] 시범 적용 결과가 목표에 미달했다. 책임 공방을 시작하기보다 다음 단계로 적절한 것은?',o:['목표와 실제 결과의 차이, 실행 조건, 예상과 달랐던 원인을 검토해 대안을 조정한다','시범 결과가 나빴으므로 문제 정의와 자료를 모두 폐기한다','실패를 감추고 같은 방법을 전면 적용한다','실행에 참여한 사람에게 원인을 한정한다'],c:0,e:['실행과 평가를 통해 원인과 조건을 다시 확인하고 해결안을 개선해야 합니다.','결과가 기대에 못 미쳐도 분석 자료는 학습과 수정에 유용합니다.','평가 없이 확대하면 같은 문제가 커질 수 있습니다.','원인을 개인으로 한정하기보다 과정·조건·자원을 함께 봐야 합니다.']},
{a:'문제해결능력',t:'[개념비교] 여러 원인을 업무흐름, 설비, 인력, 정보로 나누고 발생 빈도와 영향도를 기준으로 우선순위를 정했다. 주로 활용한 사고는?',o:['분석적 사고','발상의 전환','정보의 시간적 분류','적극적 경청'],c:0,e:['문제를 구성요소로 나누어 의미와 중요도를 따지는 것은 분석적 사고입니다.','발상의 전환은 기존 관념에서 벗어나 새로운 관점을 찾는 것입니다.','시간적 분류는 정보를 발생 시점에 따라 나누는 방법입니다.','적극적 경청은 의사소통 태도입니다.']},
{a:'문제해결능력',t:'[상황판단] 회의에서 모든 아이디어를 제시한 뒤, “이번 주에 시범 적용할 수 있고 오류 위험을 관리할 수 있는가”를 기준으로 대안을 좁힌다. 이 단계의 목적은?',o:['대안의 실행 가능성과 효과를 비교해 적절한 해결책을 선택한다','아이디어를 많이 냈으므로 검토 없이 모두 실행한다','처음 제안한 아이디어를 우선한다','문제 원인 분석을 대안 수로 대체한다'],c:0,e:['대안을 실행 가능성, 기대효과, 위험 등의 기준으로 평가해 선택하는 단계입니다.','아이디어 도출과 실제 실행은 다르며 모든 아이디어를 실행할 필요는 없습니다.','제안 순서는 대안의 적합성을 보장하지 않습니다.','대안 평가가 문제 원인 분석을 대체하지 않습니다.']},
{a:'자원관리능력',t:'[자료해석] 두 과제는 모두 금요일까지 끝나야 한다. 팀원은 2명이고 한 명당 하루 6시간까지 배정할 수 있다. 가능한 배정은?',d:'<table><tr><th>과제</th><th>남은 작업시간</th><th>기한</th><th>필수 담당</th></tr><tr><td>보고서 검토</td><td>8시간</td><td>금요일</td><td>검토 자격 보유자</td></tr><tr><td>자료 입력</td><td>10시간</td><td>금요일</td><td>자격 제한 없음</td></tr></table>',o:['자격 보유자가 검토 6시간과 입력 일부를 맡고, 나머지 입력을 다른 팀원이 맡되 총 배정시간을 하루 12시간 안에서 계획한다','자격 보유자를 두 과제에 하루 10시간씩 동시에 배정한다','입력 업무가 더 길므로 검토 자격과 관계없이 모든 시간을 입력에 배정한다','두 업무를 한 명에게 몰고 다른 팀원은 대기시킨다'],c:0,e:['필수 자격을 반영하고 두 사람의 가용시간 안에서 분담해야 합니다. 18시간 총 작업량은 팀의 하루 12시간으로 하루에 끝낼 수 없으므로 금요일까지 가능한 작업일을 계획해야 합니다.','동시에 같은 인력을 두 과제에 배정하고 하루 가용시간도 넘습니다.','검토에는 자격 요건이 있으므로 이를 무시할 수 없습니다.','한 사람에게 18시간을 맡기면 가용시간과 업무 배분 원칙을 위반합니다.']},
{a:'자원관리능력',t:'[상황판단] 행사를 준비하며 장비를 추가 구매하려 한다. 창고에는 같은 장비가 있지만 사용 가능 여부와 예약 현황은 확인되지 않았다. 자원관리의 다음 조치로 적절한 것은?',o:['필요 수량과 기존 자원의 상태·사용 가능 시점을 확인한 뒤 부족분만 확보한다','재고 확인은 시간이 걸리므로 전체 수량을 즉시 구매한다','필요한 자원량을 파악하지 않고 예산을 먼저 소진한다','기존 장비가 있으므로 상태 점검 없이 사용을 확정한다'],c:0,e:['필요량과 이용 가능한 자원을 확인해야 중복 구매와 자원 부족을 함께 예방할 수 있습니다.','확인 없이 구매하면 불필요한 지출이 생길 수 있습니다.','자원관리의 첫 단계는 필요 자원의 종류와 양을 파악하는 것입니다.','보유 여부만으로 정상 작동이나 일정상 사용 가능 여부를 알 수 없습니다.']},
{a:'자원관리능력',t:'[개념비교] 과업별 소요시간을 추정하고 마감 역산 일정표를 만들었다. 그런데 담당자가 자주 미루고 우선순위를 정하지 않아 일정이 반복해서 밀린다. 우선 다뤄야 할 요인은?',o:['내적 시간 낭비 요인인 계획·우선순위·미루기 습관','외적 시간 낭비 요인인 고객 방문','물적자원 부족','정보의 동적 변화'],c:0,e:['계획 부족과 일을 미루는 습관은 개인의 내적 시간 낭비 요인입니다.','고객 방문은 실제로 일정이 끊기는 경우 외적 요인입니다.','문항의 직접 원인은 장비가 아니라 시간 사용 습관입니다.','정보의 변화는 별도 정보관리 문제이며 일정 지연의 직접 원인으로 제시되지 않았습니다.']},
{a:'자원관리능력',t:'[자료해석] 예산 집행 현황을 보고 남은 기간의 지출을 조정하려 한다. 우선 점검할 항목은?',d:'<table><tr><th>항목</th><th>계획</th><th>현재 집행</th><th>남은 약정</th></tr><tr><td>장소 대여</td><td>120만 원</td><td>80만 원</td><td>40만 원</td></tr><tr><td>인쇄</td><td>50만 원</td><td>35만 원</td><td>0원</td></tr><tr><td>운송</td><td>30만 원</td><td>10만 원</td><td>25만 원</td></tr></table>',o:['운송은 집행액과 남은 약정을 합하면 35만 원으로 계획액 30만 원을 넘으므로 원인과 조정 가능성을 확인한다','장소 대여는 계획액 전부를 집행했으므로 초과 지출이다','인쇄는 약정이 없으므로 예산 집행률을 검토할 필요가 없다','항목별 차이는 무시하고 총예산만 보면 충분하다'],c:0,e:['운송은 10만 원 집행과 25만 원 약정을 합쳐 35만 원으로 계획액보다 5만 원 많습니다. 약정의 취소 가능성과 추가 비용 여부를 확인해야 합니다.','장소 대여는 집행 80만 원과 약정 40만 원을 합쳐 계획액 120만 원과 같습니다.','인쇄는 계획 50만 원 중 35만 원을 집행했으므로 잔액과 향후 필요를 확인할 수 있습니다.','항목별 초과와 약정 현황을 보면 총액만으로 놓칠 수 있는 문제를 찾을 수 있습니다.']},
{a:'자원관리능력',t:'[상황판단] 교육 프로젝트의 업무량은 늘었지만 예산은 고정되어 있다. 시간·인력·물적 자원을 함께 관리하는 대응으로 가장 합리적인 것은?',o:['필수 산출물과 기한을 확인하고 업무별 자원 소요를 재산정해 우선순위와 역할을 조정한다','예산이 고정되어 있으므로 업무량을 검토하지 않고 야근을 지시한다','필요 자원과 관계없이 모든 활동을 같은 비율로 삭감한다','외주를 먼저 발주하고 나중에 예산을 확인한다'],c:0,e:['업무 범위와 기한, 자원 소요를 함께 검토해 우선순위와 배치를 조정해야 합니다.','야근만으로 자원 부족이나 과업 우선순위 문제가 해결되지 않습니다.','활동별 중요도와 필수 조건을 무시한 일괄 삭감은 목표 달성을 방해할 수 있습니다.','필요성과 예산을 확인하기 전에 발주하면 예산 초과 위험이 있습니다.']},
{a:'자원관리능력',t:'[개념비교] 팀의 장비 목록은 최신이지만 보관 위치와 대여 기준이 없어 필요한 때 장비를 찾지 못한다. 개선의 초점은?',o:['물적자원의 위치·상태·공유 절차를 정해 사용 가능성을 높인다','목록을 더 자주 출력한다','장비 수량과 무관하게 개인별로 새 제품을 지급한다','대여 기록을 없애 자유롭게 사용하게 한다'],c:0,e:['물적자원 관리에는 보유량뿐 아니라 위치, 상태, 이용 기준과 절차가 필요합니다.','목록만 최신이어도 위치·공유 절차가 없으면 찾기 어려운 문제가 남습니다.','필요성과 활용도를 확인하지 않은 구매는 비효율적입니다.','기록을 없애면 위치와 이용 현황을 파악하기 어렵습니다.']},
{a:'자원관리능력',t:'[상황판단] 두 명의 직원에게 업무를 배분한다. 한 명은 분석 경험이 많고 다른 한 명은 고객 안내 경험이 많다. 이번 업무는 자료 분석과 결과 설명으로 구성된다. 적절한 배치는?',o:['역량과 과업 요구를 고려해 분석과 고객 설명 역할을 나누고 일정과 인수인계를 조정한다','직급이 높은 직원에게 두 업무를 모두 맡긴다','두 사람에게 같은 업무를 중복 배정하고 결과는 나중에 합친다','업무 특성과 관계없이 무작위로 나눈다'],c:0,e:['인적자원은 역량과 과업 요구에 맞춰 배치하고 협업 경로도 정해야 합니다.','직급만으로 배치하면 필요한 역량과 업무량을 반영하지 못합니다.','중복 수행은 시간 낭비와 책임 불분명으로 이어질 수 있습니다.','무작위 배정은 업무에 필요한 능력을 고려하지 않습니다.']},
{a:'자원관리능력',t:'[자료해석] 한 작업을 A는 6시간, B는 9시간에 끝낸다. 함께 일하면 각자 같은 속도로 작업하고 중복은 없다고 할 때, 6시간 안에 완료하려면 필요한 조건은?',o:['작업량을 쪼개 두 사람에게 병렬 배분하고 진행을 조정한다','A에게만 맡기면 6시간 안에 끝난다','B에게만 맡기면 6시간 안에 끝난다','두 사람을 투입해도 작업을 분담할 수 없다'],c:0,e:['업무가 분할 가능하다는 조건에서 병렬 작업으로 시간을 줄일 수 있습니다. 실제 분담량과 인수인계를 조정해야 합니다.','A의 단독 소요시간이 6시간이므로 여유 없이 완료되며, 작업 분담보다 빠르지는 않습니다.','B의 단독 작업은 9시간이라 6시간을 넘습니다.','문항은 작업 중복이 없고 병렬 분담 가능 조건을 둡니다.']},
{a:'정보능력',t:'[정보판단] 다음 보고서에 시장 수치를 인용하려 한다. 검색 결과 세 자료의 수치가 다르다. 가장 적절한 처리 방법은?',o:['각 자료의 발표 시점, 조사 대상, 산정 기준과 출처를 비교해 같은 기준의 수치를 사용한다','가장 큰 수치를 선택해 성장 가능성을 강조한다','세 수치를 평균내고 출처는 생략한다','최근에 본 게시물의 수치를 검증 없이 사용한다'],c:0,e:['수치 차이는 시점·대상·정의가 다를 수 있으므로 출처와 맥락을 비교해야 합니다.','유리한 수치만 선택하면 편향된 결론이 될 수 있습니다.','기준이 다른 수치의 단순 평균은 의미가 없고 출처도 확인할 수 없습니다.','최근 게시물이라는 사실만으로 신뢰성과 기준이 확보되지는 않습니다.']},
{a:'정보능력',t:'[개념비교] 여러 지점의 일별 매출 수치를 연결해 “비 오는 날에는 배달 주문 비중이 높아진다”는 판단을 도출했다. 수치 각각과 도출된 판단의 관계를 바르게 설명한 것은?',o:['개별 매출 수치는 인포메이션, 연결해 만든 판단 자료는 인텔리전스에 가깝다','개별 매출 수치는 인텔리전스, 연결된 판단은 색인이다','둘 다 색인이며 정보 분석은 아니다','판단 자료는 정보원이므로 수치와 연결할 수 없다'],c:0,e:['개별 사실이나 수치는 인포메이션이고, 여러 정보를 연결해 판단에 도움을 주는 것은 인텔리전스입니다.','개별 수치를 인텔리전스라고 할 수 없고 연결된 판단은 색인이 아닙니다.','색인은 검색어와 위치를 연결하는 관리 도구입니다.','정보원은 정보를 얻는 출처이며 도출된 판단과 같은 뜻이 아닙니다.']},
{a:'정보능력',t:'[자료해석] 작년 인원과 올해 인원을 비교한 표를 만들려 한다. 원자료로 가장 적합한 것은?',o:['각 연도의 공식 인원 집계표와 산정 기준','두 해를 비교한 출처 불명의 블로그 요약','요약 보고서의 그래프를 다시 인용한 게시글','기억에 의존해 작성한 숫자'],c:0,e:['공식 집계표는 원자료에 가까우며 기준을 확인할 수 있어 비교에 적합합니다.','요약은 출처와 기준을 검증하기 어려울 수 있습니다.','재인용된 자료는 원자료와 산정 기준을 확인해야 합니다.','기억에 의존한 수치는 검증 가능한 자료가 아닙니다.']},
{a:'정보능력',t:'[개념비교] 연구자가 직접 설문을 실시한 원자료와, 여러 연구를 요약한 백과사전 항목을 함께 참고했다. 두 자료의 유형은?',o:['직접 조사 결과는 1차 자료, 백과사전 요약은 2차 자료','직접 조사 결과는 2차 자료, 백과사전은 1차 자료','둘 다 1차 자료','둘 다 색인 자료'],c:0,e:['원래의 조사·연구 성과는 1차 자료이고 여러 자료를 요약·정리한 백과사전은 2차 자료입니다.','두 자료의 관계를 거꾸로 설명했습니다.','백과사전 항목은 원 연구 자체가 아닌 요약 정보입니다.','색인은 키워드와 자료 위치를 연결하는 도구입니다.']},
{a:'정보능력',t:'[정보관리] 매뉴얼 한 권의 제목·저자·발행일은 한 번 기록하고, 본문 주제어마다 해당 쪽수를 연결하려 한다. 목록과 색인의 적용은?',o:['제목·저자·발행일은 목록, 주제어·쪽수는 색인으로 관리한다','제목·저자·발행일은 색인, 주제어·쪽수는 목록으로 관리한다','두 항목 모두 시간적 분류다','두 항목 모두 동적 정보다'],c:0,e:['목록은 정보원 자체의 주요 서지 항목을 정리하고 색인은 주제어와 위치정보를 연결합니다.','목록과 색인의 기능이 반대로 설명되었습니다.','시간적 분류는 발생 시점이나 연도에 따라 나누는 방법입니다.','동적 정보는 시시각각 변하는 정보 유형으로 이 문항의 관리도구 구분과 다릅니다.']},
{a:'정보능력',t:'[상황판단] 안전 절차가 개정되었는지 확인하려 한다. 검색 결과에는 최근 블로그 글과 2년 전 기관 매뉴얼이 있다. 가장 신뢰성 높은 확인 순서는?',o:['관할 기관의 최신 공식 공지와 개정 이력을 확인하고 적용 시점을 대조한다','블로그 게시일이 더 최근이므로 그대로 적용한다','오래된 매뉴얼은 내용이 익숙하므로 계속 사용한다','두 자료의 문장을 섞어 새 절차를 만든다'],c:0,e:['절차의 최신성과 권한 있는 출처, 시행 시점을 공식 자료로 확인해야 합니다.','최근성만으로 공식성·정확성이 보장되지 않습니다.','익숙하다는 이유로 과거 절차를 적용하면 개정 내용을 놓칠 수 있습니다.','서로 다른 자료를 임의로 결합하면 실제 절차와 다를 수 있습니다.']},
{a:'정보능력',t:'[자료해석] 고객지원에 자주 쓰는 정보를 검색하려 한다. 다음 중 색인에 해당하는 구성은?',o:['“환불”이라는 검색어와 해당 안내서의 절·쪽수 연결','안내서 제목·저자·발행일을 한 줄로 기록','안내서를 연도 폴더에 저장','고객 문의 원문을 날짜순으로 배열'],c:0,e:['색인은 주제어와 정보원의 특정 위치를 연결해 원하는 정보를 찾게 합니다.','제목·저자·발행일 정리는 목록에 해당합니다.','연도 폴더는 시간 기준 분류입니다.','문의 원문을 날짜순으로 배열하는 것은 시간 기준 정리이지 색인은 아닙니다.']},
{a:'정보능력',t:'[상황판단] 지난달 정책 변경 뉴스와 확정된 업무 매뉴얼을 함께 검토한다. 활용 시 가장 유의할 점은?',o:['뉴스는 동적 정보이므로 현재 상태를 확인하고, 매뉴얼은 발행·개정 시점을 점검한다','뉴스는 항상 정적 정보이고 매뉴얼은 항상 동적 정보다','매뉴얼이 문서 형식이므로 최신성 확인은 필요 없다','뉴스는 빨리 바뀌므로 출처 확인 없이 사용한다'],c:0,e:['뉴스처럼 변하는 정보는 활용 시점의 최신 상태를 확인해야 하고, 매뉴얼도 개정 시점을 확인해야 합니다.','동적·정적 정보 구분은 문서 모양이 아니라 정보가 변하는 성격과 관련됩니다.','저장된 문서도 개정될 수 있으므로 발행·개정 시점 확인이 필요합니다.','변화가 빠를수록 출처와 확인 시점이 중요합니다.']},
{a:'정보능력',t:'[문제해결 연계] 부서별 파일 이름이 달라 같은 계약서를 여러 번 저장하고 있다. 찾기와 중복을 줄이는 개선안은?',o:['공통 파일명 규칙, 분류 기준, 최신본 표시와 보관 위치를 정한다','파일을 하나의 폴더에 합치고 이름은 각자 정한다','검색을 쉽게 하려고 파일을 계속 복제한다','자료 출처와 수정 이력을 삭제한다'],c:0,e:['일관된 분류와 명명, 최신본·위치 관리 규칙이 검색성과 중복 방지에 도움이 됩니다.','기준이 없으면 같은 문제가 계속됩니다.','복제는 중복과 최신본 혼동을 악화시킬 수 있습니다.','출처와 이력은 자료의 신뢰성과 변경 확인에 필요합니다.']},
{a:'정보능력',t:'[자료해석] 내부 보고서에서 “업무량이 늘었다”는 주장을 검토한다. 판단을 위해 추가로 확인할 정보로 가장 적절한 것은?',o:['비교 기간, 업무량 산정 기준, 처리 건수와 인력 변화','보고서 작성자의 직급','표의 색상과 글꼴','회의 참석자의 개인적 인상'],c:0,e:['비교 가능한 기간과 동일한 산정 기준, 관련 투입·산출 자료가 있어야 주장을 검증할 수 있습니다.','직급은 수치의 정의와 변화 근거를 대신하지 않습니다.','서식은 주장의 타당성을 판단하는 핵심 자료가 아닙니다.','인상만으로는 객관적 변화 여부를 확인하기 어렵습니다.']},
{a:'정보능력',t:'[상황판단] 보고서용 자료를 찾다가 관련 검색 결과를 300건 모았다. 마감은 오늘이고 질문은 “어느 안내 방식이 문의를 줄였는가”이다. 효율적인 다음 단계는?',o:['질문에 맞는 기간·안내 방식·문의 건수 자료를 선별하고 비교 기준을 정한다','검색 결과를 전부 읽고 나서 질문을 정한다','자료가 많으므로 모두 같은 비중으로 인용한다','가장 먼저 나온 결과만으로 결론을 작성한다'],c:0,e:['정보 요구를 구체화하고 질문과 직접 관련된 자료를 선별·비교해야 합니다.','질문이 먼저 정리되어야 수집 범위를 효율적으로 좁힐 수 있습니다.','자료의 양이 많아도 관련성과 신뢰성이 같지는 않습니다.','검색 순위는 해당 결론의 근거가 되지 않습니다.']},
{a:'정보능력',t:'[정보판단] 현황표의 수치는 지난 분기 기준이고, 의사결정은 이번 분기 인력 배치에 관한 것이다. 자료를 사용하기 전 우선 확인할 것은?',o:['이번 분기 자료로 갱신됐는지, 업무 조건과 정의가 바뀌었는지 확인한다','수치가 표로 정리되어 있으므로 현재에도 그대로 적용한다','과거 수치를 최신 수치와 평균내어 시점을 감춘다','자료의 날짜를 보고서에서 삭제한다'],c:0,e:['결정 시점에 맞는 최신성과 비교 가능성을 점검해야 합니다.','정돈된 형식은 현재성이나 적합성을 보장하지 않습니다.','기준 시점이 다른 값의 임의 평균은 정보를 왜곡합니다.','시점을 밝히지 않으면 독자가 자료의 한계를 판단할 수 없습니다.']}
];
const EXTRA=[];
function addExtra(a,t,o,c,e){const k=EXTRA.length%4,ro=o.slice(k).concat(o.slice(0,k)),re=e.slice(k).concat(e.slice(0,k));EXTRA.push({a,t,o:ro,c:(c-k+4)%4,e:re})}
addExtra('의사소통능력','[상황판단] 팀 회의록에 “새 일정 검토”라고만 적혀 실행 담당자와 마감이 빠졌다. 회의 직후 가장 필요한 보완은?',['담당자·완료 시점·결정 내용을 참석자와 확인해 회의록에 반영한다','문장이 짧으므로 그대로 보관한다','참석자 중 직급이 높은 사람에게만 구두로 알린다','다음 회의에서 기억나는 대로 다시 정한다'],0,['결정사항과 책임자, 기한을 확인해야 기록이 실행 가능한 업무 정보가 됩니다.','간결함은 좋지만 핵심 실행 정보가 빠져 있어 보완이 필요합니다.','구두 전달만으로는 참석자 간 동일한 기록이 남지 않습니다.','기억에 의존하면 누락이나 해석 차이가 생깁니다.']);
addExtra('의사소통능력','[문서이해] 공지에는 “신청자 중 필수교육 이수자에게만 장비 대여”라고 적혀 있다. 교육 미이수자가 신청서를 냈을 때 담당자의 판단은?',['신청만으로 대여 대상이 되지는 않으므로 교육 이수 여부를 확인한다','신청서를 냈으므로 장비를 바로 대여한다','교육은 권고사항이라고 간주한다','신청자 수가 적으면 조건을 생략한다'],0,['공지에는 신청과 필수교육 이수가 모두 조건으로 제시되어 있습니다.','신청은 필요할 수 있지만 교육 조건을 충족하지 못했습니다.','“필수” 조건을 임의로 권고사항으로 바꿀 수 없습니다.','신청 규모가 조건을 바꾸지는 않습니다.']);
addExtra('의사소통능력','[상황판단] 고객은 “빠른 처리”를 원한다고만 말했다. 실제 요청을 파악하기 위해 가장 적절한 질문은?',['언제까지 필요한지와 우선 처리 대상이 무엇인지 구체적으로 확인한다','우리 기준으로 빠른 처리라고 판단해 일정을 정한다','다른 고객도 급하다고 말한다고 설명한다','요청을 모호한 상태로 접수 완료 처리한다'],0,['모호한 표현을 기한과 대상 등 확인 가능한 조건으로 구체화해야 합니다.','상대가 뜻한 “빠름”과 다를 수 있어 추측은 위험합니다.','다른 고객의 사정은 이 고객의 요구를 구체화하지 않습니다.','핵심 조건이 확인되지 않아 완전한 접수로 보기 어렵습니다.']);
addExtra('의사소통능력','[개념비교] 이메일에서 결론, 근거, 요청사항을 앞부분에 정리하고 상세 내역은 첨부했다. 이 구성의 주된 장점은?',['수신자가 목적과 해야 할 일을 빠르게 파악한다','첨부파일만 읽어도 된다는 뜻이 된다','근거를 생략해도 정확성이 높아진다','공식 결재 절차가 필요 없어진다'],0,['핵심과 요청을 먼저 제시하면 업무 문서의 목적이 분명해집니다.','첨부는 상세 내용을 보완할 뿐 본문 핵심을 대체하지 않습니다.','근거는 필요에 따라 포함해야 판단을 뒷받침합니다.','문서 구조가 조직의 결재 절차를 대체하지는 않습니다.']);
addExtra('의사소통능력','[상황판단] 동료가 설명한 내용을 듣고 이해했다고 생각했지만, “다음 주 초”라는 표현의 날짜 해석이 서로 달랐다. 재발 방지책은?',['주요 일정은 날짜와 시각으로 바꾸어 서로 확인하고 기록한다','모호한 표현은 관행에 맡긴다','상대가 틀렸다고 지적하고 대화를 끝낸다','다음부터는 일정 관련 대화를 하지 않는다'],0,['상대와 공유하는 기준으로 구체화하면 해석 차이를 줄일 수 있습니다.','관행은 사람이나 조직에 따라 달라 모호함을 남깁니다.','책임 공방만으로 공통된 일정 기준을 만들 수 없습니다.','일정 정보는 업무에 필요하므로 확인 방식을 개선해야 합니다.']);
addExtra('의사소통능력','[문서작성] 내부 결재 문서에 여러 대안을 비교해 승인받으려 한다. 읽는 사람이 판단하기 좋은 구성은?',['목적·현황·대안별 비용과 효과·요청 결정을 구분해 제시한다','대안 중 선호안만 길게 설명하고 나머지는 생략한다','배경과 무관한 자료를 모두 본문에 붙인다','결재권자가 알아서 판단하도록 요청사항을 쓰지 않는다'],0,['비교 기준과 요청 결정을 구조화해야 합리적인 검토가 가능합니다.','대안 간 비교가 불가능해져 판단 근거가 부족합니다.','관련 없는 자료는 핵심을 흐립니다.','결정 요청을 명확히 해야 결재자가 무엇을 판단할지 알 수 있습니다.']);
addExtra('의사소통능력','[상황판단] 고객이 항의 중이다. 담당자는 사실관계를 파악하기 전에 해결책부터 설명하려 한다. 더 나은 첫 대응은?',['불편을 경청하고 발생 시점·요청사항을 확인해 문제를 정확히 파악한다','고객의 말을 중단시키고 규정을 읽어준다','원인을 모르는 상태에서 보상을 약속한다','고객의 감정을 과장이라고 판단한다'],0,['경청과 사실 확인이 선행되어야 적절한 해결안을 선택할 수 있습니다.','일방 설명은 핵심 사실과 고객 요구를 놓치게 할 수 있습니다.','확인되지 않은 약속은 이행 문제를 낳을 수 있습니다.','감정 평가보다 상황과 요구를 확인해야 합니다.']);
addExtra('의사소통능력','[자료해석] 안내문 개정 전후 민원 건수다. 개정 효과를 해석할 때 가장 타당한 접근은?',['같은 기간·유사한 업무량 기준으로 민원 유형과 건수를 비교한다','개정 직후 하루의 건수만으로 효과를 확정한다','민원이 줄었으면 다른 변화는 조사하지 않는다','전후 기간이 다르더라도 총건수만 비교한다'],0,['기간과 업무량 등 비교 기준을 맞추고 유형 변화도 확인해야 합니다.','하루 수치는 우연 변동의 영향을 크게 받습니다.','동시에 바뀐 요인이 있을 수 있어 인과를 단정할 수 없습니다.','기간이 다르면 총건수 비교가 왜곡될 수 있습니다.']);
addExtra('의사소통능력','[개념비교] 상대가 말한 내용을 자신의 표현으로 요약한 뒤 “제가 이해한 것이 맞나요?”라고 물었다. 기대 효과는?',['상대의 의미를 확인하고 오해를 줄인다','상대의 의견을 대신 결정한다','대화에서 불편한 정보를 걸러낸다','비언어적 표현을 불필요하게 만든다'],0,['요약 후 확인은 이해가 정확한지 점검하는 적극적 경청 방법입니다.','요약은 상대의 결정을 대신하지 않습니다.','불편한 정보도 확인 대상이며 걸러 듣기가 아닙니다.','비언어적 표현은 여전히 의사소통에 영향을 줍니다.']);
addExtra('의사소통능력','[상황판단] 팀장이 구두로 업무를 지시했는데 담당자와 완료 기준이 불분명하다. 가장 적절한 대응은?',['이해한 과업·담당 범위·완료 기준을 되짚고 필요한 조건을 질문한다','불분명한 부분은 본인이 임의로 정한다','다른 팀의 관행을 확인 없이 적용한다','지시가 모호하므로 아무 일도 하지 않는다'],0,['요약과 확인 질문으로 지시의 의미를 맞추고 실행 조건을 분명히 해야 합니다.','임의 해석은 지시자 의도와 달라질 수 있습니다.','상황이 다를 수 있어 관행을 그대로 적용할 근거가 없습니다.','확인 질문으로 해결할 수 있는 모호함을 방치하게 됩니다.']);
addExtra('의사소통능력','[문서이해] 한 보고서에는 전년 대비 매출이 8% 늘었다고 쓰였고, 부록에는 기준 변경으로 비교 불가라고 적혀 있다. 보고서를 인용할 때 해야 할 일은?',['기준 변경 내용을 확인하고 같은 기준으로 비교 가능한지 검토한다','본문의 8%만 인용한다','부록은 본문이 아니므로 무시한다','증가율을 그대로 다음 연도 전망으로 사용한다'],0,['비교 기준이 바뀌면 증가율 해석이 달라질 수 있어 주석을 확인해야 합니다.','본문 수치만 취하면 중요한 제한을 빠뜨립니다.','부록의 주석도 수치 해석에 필요한 정보입니다.','과거 증가율이 미래 증가를 보장하지 않습니다.']);
addExtra('의사소통능력','[상황판단] 발표 시간이 5분으로 줄었다. 자료를 효과적으로 전달하는 방법은?',['핵심 결론과 근거를 추리고 세부 자료는 질의응답용으로 준비한다','모든 슬라이드를 빠르게 읽는다','자료의 제목만 보여주고 결론을 생략한다','글자를 작게 줄여 모든 내용을 한 장에 넣는다'],0,['시간과 청중에 맞춰 핵심을 선별하되 필요한 근거를 남기는 방식입니다.','속도만 높이면 이해와 핵심 전달이 어려워집니다.','결론과 근거가 없어 청중이 판단하기 어렵습니다.','가독성을 낮추면 정보 전달력이 떨어집니다.']);
addExtra('의사소통능력','[개념비교] 공식 요청 공문과 팀 내부 메모를 작성한다. 두 문서에 공통으로 필요한 원칙은?',['목적과 수신자를 고려해 핵심 내용을 정확히 전달한다','두 문서 모두 동일한 결재 양식을 사용한다','내부 메모에도 반드시 대외 공문 형식을 쓴다','모든 문서에서 배경 설명을 생략한다'],0,['문서 종류가 달라도 목적·대상에 맞는 정확하고 분명한 전달이 필요합니다.','문서 유형과 조직 절차에 따라 양식은 달라질 수 있습니다.','내부 메모와 대외 공문은 목적과 형식이 다를 수 있습니다.','배경은 판단에 필요할 때 포함해야 합니다.']);
addExtra('의사소통능력','[상황판단] 회의에서 발언이 적은 담당자에게도 현장 정보를 듣고 싶다. 진행자의 적절한 질문은?',['“현장에서 실제로 달라진 점이 있었는지 말씀해 주시겠어요?”','“다른 분들도 동의하시죠?”','“추가 의견은 없다고 기록하겠습니다.”','“제 안에 반대하지 않는 것으로 이해하겠습니다.”'],0,['열린 질문은 현장 경험과 구체적 정보를 끌어낼 수 있습니다.','유도 질문은 자유로운 의견을 제한합니다.','침묵을 의견 없음으로 단정하면 중요한 정보를 놓칠 수 있습니다.','반대하지 않았다는 이유만으로 동의로 볼 수 없습니다.']);
addExtra('의사소통능력','[자료해석] 세 지점에서 같은 안내문을 사용했는데 한 곳에서만 문의가 많다. 우선 비교할 자료는?',['지점별 고객 구성·안내 노출·문의 유형과 응대 방식','안내문 파일의 용량','지점장의 근속연수','문의가 적은 지점의 만족도 추정치'],0,['문의 차이를 설명할 수 있는 노출, 고객, 문의 내용, 응대 조건을 비교해야 합니다.','파일 용량은 안내 효과와 직접 관련된 근거가 아닙니다.','근속연수만으로 문의 차이를 설명할 수 없습니다.','추정치는 실제 비교 자료를 대신하지 못합니다.']);
addExtra('의사소통능력','[상황판단] 요청 메일을 받은 사람이 담당자가 아닌 경우, 업무 누락을 막는 방법은?',['담당 부서와 책임자를 확인해 전달하고 전달 사실과 기한을 알린다','메일을 삭제하고 발신자가 다시 보내길 기다린다','전 직원에게 원문을 무차별 전달한다','읽었으므로 처리 완료로 표시한다'],0,['올바른 담당자에게 맥락과 기한을 전달하고 인수 여부를 확인해야 합니다.','삭제하면 요청이 누락될 수 있습니다.','불필요한 전파는 정보 과잉과 개인정보 노출 위험을 키울 수 있습니다.','읽음과 처리 완료는 다른 상태입니다.']);
addExtra('문제해결능력','[문제정의] 고객 대기시간이 길다는 불만이 있다. 해결안을 고르기 전에 가장 먼저 정리할 것은?',['목표 대기시간, 실제 대기시간, 시간대·업무유형별 차이','대기시간을 줄일 장비 구매 목록','가장 최근에 입사한 직원의 업무 속도','경쟁사의 홍보 문구'],0,['기대 상태와 현재 현상을 구체적이고 비교 가능한 기준으로 정의해야 합니다.','구매는 원인과 필요를 확인한 뒤 검토할 해결안입니다.','개인 책임을 먼저 가정하면 과정 원인을 놓칠 수 있습니다.','홍보 문구는 현재 문제의 측정 자료가 아닙니다.']);
addExtra('문제해결능력','[자료해석] 세 달간 지연률이다. 개선 우선순위를 정하기 위한 해석으로 적절한 것은?',['전체 평균뿐 아니라 지연이 집중된 업무와 기간을 나누어 원인을 확인한다','가장 높은 한 달만 보고 같은 조치를 전 기간에 적용한다','평균이 낮아졌으면 남은 지연은 무시한다','건수와 처리량의 차이를 고려하지 않는다'],0,['세부 유형·기간·분모를 나누어 보면 개선이 필요한 지점을 찾을 수 있습니다.','한 시점의 최고값만으로 전체 원인을 대표할 수 없습니다.','평균 개선이 개별 중요 문제의 해소를 뜻하지 않습니다.','처리량이 다르면 건수 비교는 지연 위험을 왜곡할 수 있습니다.']);
addExtra('문제해결능력','[개념비교] 장애가 발생해 즉시 복구하는 과제와, 현재 절차의 불필요한 단계를 줄이는 과제의 유형은?',['발생형과 탐색형','설정형과 발생형','탐색형과 설정형','둘 다 설정형'],0,['이미 일어난 장애는 발생형, 현재 방식 개선은 탐색형입니다.','현재 절차 개선을 미래 목표 설정으로 볼 수 없습니다.','장애 복구는 이미 발생한 문제입니다.','두 과제의 성격이 서로 다릅니다.']);
addExtra('문제해결능력','[상황판단] 한 직원의 실수 직후 같은 유형의 오류가 다른 팀에서도 발견됐다. 원인 분석의 바람직한 범위는?',['업무 절차·교육·시스템·작업 조건을 함께 살펴 반복 원인을 찾는다','첫 실수를 한 직원만 면담한다','오류 기록을 삭제해 평판을 보호한다','모든 직원을 즉시 징계한다'],0,['반복 발생은 개인 외에 시스템이나 절차 원인이 있을 수 있으므로 전체 맥락을 봐야 합니다.','첫 사례만 보면 공통 원인을 확인하기 어렵습니다.','기록 삭제는 원인 분석과 재발 방지를 막습니다.','징계는 원인을 확인하거나 절차를 개선하는 대체책이 아닙니다.']);
addExtra('문제해결능력','[가설검증] “업무량 증가가 오류를 늘렸다”는 가설을 확인하려 한다. 가장 적절한 자료 분석은?',['업무량 구간별 오류율을 비교하고 교육·난이도 등 다른 조건도 함께 점검한다','오류가 많았던 날의 업무량만 확인한다','가설과 맞는 사례만 골라 제시한다','오류 건수와 업무량의 단위를 무시하고 비교한다'],0,['비율과 다른 조건을 비교해야 업무량과 오류의 관계를 더 타당하게 판단할 수 있습니다.','하루 사례는 우연이나 특수 조건의 영향을 받을 수 있습니다.','맞는 사례만 선택하면 확인 편향이 생깁니다.','분모와 측정 단위가 다르면 비교가 의미 없을 수 있습니다.']);
addExtra('문제해결능력','[대안평가] 개선안 A는 효과가 크지만 법규 검토가 미완료이고, B는 효과가 보통이며 검토를 마쳤다. 다음 단계로 가장 합리적인 것은?',['A의 법규 적합성을 확인하고, 동시에 B를 기준 대안으로 비교한다','효과가 큰 A를 즉시 전면 시행한다','검토가 끝난 B는 효과가 보통이므로 제외한다','법규 검토는 실행 뒤에 해도 된다'],0,['법규 적합성은 필수 제약조건이므로 확인하고 검증된 대안과 함께 비교해야 합니다.','효과만 보고 규정 리스크를 무시하면 안 됩니다.','효과와 실행 가능성 등 기준을 함께 검토해야 합니다.','실행 후 검토는 사전 위험 통제를 대체하지 못합니다.']);
addExtra('문제해결능력','[전략적 사고] 재고를 줄이는 방안이 구매비용은 낮추지만 긴급 주문을 늘릴 수 있다. 의사결정에 포함해야 할 관점은?',['구매비용뿐 아니라 품절·긴급운송·고객 영향까지 전체 비용을 본다','재고 보관비만 낮아지면 최적이라고 판단한다','긴급 주문은 다른 부서 책임이므로 제외한다','단기 절감만 보고 장기 효과를 무시한다'],0,['부분 비용이 아닌 시스템 전체의 비용과 서비스 영향을 함께 살펴야 합니다.','보관비 절감이 다른 비용 증가보다 크다고 단정할 수 없습니다.','연관 부서의 비용도 조직 전체 성과에 포함됩니다.','단기 성과만 보면 지속가능성과 후속 비용을 놓칩니다.']);
addExtra('문제해결능력','[상황판단] 원인 후보가 여러 개라 회의가 산만해졌다. 논의를 다시 집중시키는 방법은?',['문제를 측정 가능한 문장으로 다시 쓰고 각 원인 후보의 근거와 확인 방법을 정한다','가장 크게 말하는 사람의 설명을 채택한다','원인 후보를 검증 없이 모두 사실로 취급한다','논의 시간을 줄이려고 무작위 대안을 고른다'],0,['공통 문제 정의와 검증 가능한 근거를 두면 논의를 구조화할 수 있습니다.','발언 강도는 근거의 타당성을 뜻하지 않습니다.','후보는 검증할 설명이지 확정 사실이 아닙니다.','무작위 선택은 효과와 위험을 비교하지 않습니다.']);
addExtra('문제해결능력','[자료해석] 개선 전 100건 중 오류 12건, 개선 후 200건 중 오류 18건이다. 가장 정확한 해석은?',['오류 건수는 늘었지만 오류율은 12%에서 9%로 낮아졌다','오류 건수가 늘었으므로 개선은 반드시 실패했다','오류율은 비교할 수 없다','개선 후 오류가 18%가 되었다'],0,['전에는 12/100=12%, 후에는 18/200=9%이므로 건수와 비율이 다른 방향으로 움직입니다.','처리량이 두 배가 되어 절대 건수만으로 실패라고 할 수 없습니다.','분모가 주어져 있으므로 오류율을 비교할 수 있습니다.','18건은 200건 중 9%입니다.']);
addExtra('문제해결능력','[실행·평가] 시범 개선안의 효과를 공정하게 평가하기 위한 설계는?',['시범 전후에 같은 지표와 비슷한 조건을 쓰고 예외 요인을 기록한다','시범 후 가장 좋은 사례만 선택한다','지표를 결과를 본 뒤 유리하게 바꾼다','효과가 있는지 담당자의 인상만 묻는다'],0,['같은 정의와 조건의 지표를 써야 전후 비교가 가능하며 예외도 기록해야 합니다.','좋은 사례만 고르면 대표성이 사라집니다.','사후 지표 변경은 평가의 객관성을 훼손합니다.','인상은 유용한 보조 정보지만 효과 측정을 대신하지 않습니다.']);
addExtra('문제해결능력','[개념비교] 목표를 달성하는 방법을 미리 설계하고 기대 결과를 분명히 했다. 주된 접근은?',['성과 지향 접근','가설 지향 접근','정보의 목록화','발생형 문제 분류'],0,['기대 결과와 효과적인 달성 방법을 사전에 구상하는 것은 성과 지향 접근입니다.','가설 지향은 잠정 원인을 세워 검증하는 접근입니다.','목록화는 정보원 항목을 정리하는 방법입니다.','발생형은 문제의 유형이지 계획 방식이 아닙니다.']);
addExtra('문제해결능력','[상황판단] 고객 요구가 늘어 업무 병목이 생겼다. 여러 부서가 함께 해결해야 할 때 촉진자의 역할은?',['쟁점을 명확히 하고 참여자들이 근거를 공유해 실행 가능한 합의를 만들도록 돕는다','특정 부서의 책임을 먼저 발표한다','본인이 해결안을 정하고 동의를 요구한다','반대 의견을 시간 낭비로 보고 제외한다'],0,['촉진자는 참여와 논의를 구조화해 집단이 합리적 결론에 이르도록 지원합니다.','책임을 먼저 단정하면 원인과 협업을 가릴 수 있습니다.','결론 강요는 집단 합의를 대신합니다.','반대 의견은 위험과 누락을 발견하는 근거가 될 수 있습니다.']);
addExtra('문제해결능력','[문제유형] 현재 업무의 불편을 줄이는 과제와, 아직 존재하지 않는 신규 사업 목표를 정하는 과제를 구분하면?',['전자는 탐색형, 후자는 설정형','전자는 발생형, 후자는 탐색형','전자는 설정형, 후자는 발생형','둘 다 발생형'],0,['현재 상태의 개선은 탐색형, 미래 지향 목표 설정은 설정형입니다.','불편이 이미 사고로 발생한 복구 과제라고 제시되지는 않았습니다.','두 유형의 방향이 반대로 설명되었습니다.','미래 목표를 새로 정하는 것은 발생형이 아닙니다.']);
addExtra('문제해결능력','[상황판단] 개선안이 한 부서의 업무시간은 줄이지만 고객 대기시간을 늘릴 수 있다. 판단 기준은?',['조직 전체 흐름과 고객 결과를 포함한 목표 지표를 함께 비교한다','부서의 시간 단축만 성과로 기록한다','고객 대기는 측정하기 어려우므로 제외한다','다른 부서 영향은 실행 후에만 고려한다'],0,['부서 최적화가 전체 성과를 해치지 않는지 고객 결과와 함께 확인해야 합니다.','국소 지표만 보면 전체 목표 악화를 놓칠 수 있습니다.','측정 방식을 정해 평가에 포함할 수 있습니다.','예상 가능한 영향은 실행 전에 위험으로 검토해야 합니다.']);
addExtra('문제해결능력','[자료해석] 해결안 시행 뒤 목표 달성률은 올랐지만 재작업률도 증가했다. 결론으로 알맞은 것은?',['목표 지표와 부작용 지표를 함께 보고 개선안의 순효과를 검토한다','목표 달성률이 올랐으므로 성공을 확정한다','재작업 증가는 목표와 무관하므로 무시한다','지표가 서로 다르면 평가를 중단한다'],0,['성과와 부작용을 함께 평가해야 의도하지 않은 비용까지 판단할 수 있습니다.','한 지표만으로 전체 효과를 확정하기 어렵습니다.','재작업은 품질과 비용에 영향을 줄 수 있습니다.','여러 지표의 상충은 평가와 조정의 이유이지 중단 이유가 아닙니다.']);
addExtra('자원관리능력','[자원배분] 팀은 발표자료 12시간, 데이터 검증 8시간을 이번 주에 끝내야 한다. 검증 자격자는 한 명뿐이다. 배분 원칙으로 적절한 것은?',['자격자가 검증 시간을 확보하고 나머지 발표 작업은 역량과 가용시간에 따라 분담한다','자격자를 발표자료에 먼저 배치하고 검증은 아무나 맡긴다','두 업무를 모두 자격자에게 몰아준다','자격 요건과 관계없이 업무를 무작위 배정한다'],0,['필수 역량이 필요한 검증을 우선 확보하고 다른 업무를 팀의 잔여 역량에 맞춰 분담해야 합니다.','검증 요건을 충족하지 못하면 결과 신뢰성이 떨어질 수 있습니다.','한 사람에게 과도하게 몰면 가용시간과 병목을 무시합니다.','무작위 배정은 과업 요구를 반영하지 않습니다.']);
addExtra('자원관리능력','[자료해석] 인쇄물은 600부가 필요하다. 창고의 양품 180부, 재사용 가능한 반품 70부, 파손 30부가 있다. 추가 확보량은?',['350부','320부','380부','420부'],0,['사용 가능한 수량은 180+70=250부이므로 600-250=350부를 확보합니다.','파손 30부를 사용 가능 수량에서 제외하지 않은 계산입니다.','양품과 재사용품을 더하는 대신 파손품을 추가로 빼는 계산입니다.','창고의 사용 가능한 재고를 반영하지 않은 값입니다.']);
addExtra('자원관리능력','[상황판단] 장비가 충분한데도 작업이 지연된다. 장비 추가 구매를 결정하기 전에 확인할 것은?',['고장·예약·위치·작업시간대 등 실제 사용 가능성과 병목 조건','장비 카탈로그의 최신 모델','다른 팀이 보유한 장비의 색상','구매 예산의 잔액만'],0,['재고 수량과 실제 사용 가능성은 다르므로 상태와 일정상 병목을 조사해야 합니다.','최신 모델 여부는 현재 지연 원인을 밝히지 않습니다.','색상은 작동·가용성 판단에 관련되지 않습니다.','예산 잔액만으로 구매 필요성이나 효과를 알 수 없습니다.']);
addExtra('자원관리능력','[시간관리] 하루 업무 중 긴급 요청에 계속 대응해 중요한 보고서가 늦어진다. 우선 개선할 방법은?',['중요 업무 시간을 확보하고 긴급 요청의 분류·위임·응답 기준을 정한다','보고서를 퇴근 후에만 작성한다','모든 요청을 즉시 처리한다','요청 내용을 기록하지 않는다'],0,['우선순위와 방해 대응 방식을 설계해 중요한 업무에 집중 시간을 확보해야 합니다.','장시간 근무에 의존하면 지속 가능하지 않습니다.','요청을 모두 즉시 처리하면 중요한 과업이 계속 밀립니다.','기록이 없으면 요청의 중요도와 반복 패턴을 관리하기 어렵습니다.']);
addExtra('자원관리능력','[예산관리] 견적이 예상보다 15% 높아졌다. 예산을 지키기 위한 첫 대응은?',['변경된 범위·단가·수량을 확인하고 필수 항목과 조정 가능한 항목을 구분한다','차액을 다른 항목에 임의로 숨긴다','검토 없이 가장 싼 업체로 바꾼다','예산표에서 초과분을 삭제한다'],0,['초과 원인을 확인한 뒤 필수도와 대안을 비교해야 책임 있게 조정할 수 있습니다.','비용을 숨기면 예산 통제와 보고가 왜곡됩니다.','품질·조건 검토 없이 최저가만 고르면 추가 위험이 생깁니다.','기록 삭제는 실제 재정 상태를 감춥니다.']);
addExtra('자원관리능력','[인적자원] 한 직원에게 업무가 집중되고 다른 직원은 대기 중이다. 재배치 전 확인할 요소는?',['각 업무의 필수 역량·마감·현재 부하와 인수인계 비용','직원의 나이와 개인 선호만','업무 이름의 길이','팀에서 가장 오래 근무한 사람의 의견만'],0,['과업 요구와 기한, 실제 업무량 및 인수인계 가능성을 함께 봐야 합니다.','나이나 선호만으로 역량과 업무 적합성을 판단할 수 없습니다.','업무 이름 길이는 배치 기준이 아닙니다.','근속이나 개인 의견만으로 전체 작업량을 알 수 없습니다.']);
addExtra('자원관리능력','[자료해석] 예산 계획은 200만 원이다. 계약 120만 원, 이미 지출한 소모품 35만 원, 아직 발주하지 않은 교통비 추정 60만 원이다. 예상 초과액은?',['15만 원','0원','35만 원','60만 원'],0,['예상 합계는 120+35+60=215만 원으로 계획보다 15만 원 많습니다.','예상 합계가 계획을 15만 원 초과합니다.','이미 지출액과 계약, 추정 비용을 모두 포함해야 합니다.','교통비만으로 초과액을 계산한 값입니다.']);
addExtra('자원관리능력','[상황판단] 사용률이 낮은 소프트웨어 구독이 여러 부서에 중복되어 있다. 효율적인 조치는?',['사용 부서·계약기간·실제 사용량을 확인해 통합 또는 수량 조정을 검토한다','갱신일을 확인하지 않고 모두 즉시 해지한다','중복 여부와 관계없이 각 부서에 신규 구독을 제공한다','사용량 자료를 보지 않고 비용만 균등 삭감한다'],0,['실제 필요와 계약 조건을 확인한 뒤 통합·감축 여부를 결정해야 합니다.','즉시 해지는 필수 사용자의 업무를 중단시킬 수 있고 계약 조건도 확인해야 합니다.','중복 구매를 늘리는 것은 낭비를 악화시킵니다.','부서별 필요와 활용도를 무시한 일괄 삭감은 적절하지 않을 수 있습니다.']);
addExtra('자원관리능력','[개념비교] 통근 혼잡 때문에 납품 준비가 늦는 경우와 담당자의 우유부단으로 착수가 늦는 경우는?',['외적 시간 낭비 요인과 내적 시간 낭비 요인','내적 요인과 외적 요인','둘 다 예산 문제','둘 다 물적자원 문제'],0,['교통 혼잡은 외부 환경, 우유부단은 개인의 시간 사용 습관과 관련됩니다.','두 요인의 분류가 서로 뒤바뀌었습니다.','시간 낭비의 원인을 예산 문제로 설명하지 않습니다.','장비나 재료 부족이 원인으로 제시되지 않았습니다.']);
addExtra('자원관리능력','[일정관리] 두 업무가 같은 날 같은 전문가의 검토를 필요로 한다. 일정 충돌을 줄이는 방법은?',['선후 관계와 소요시간을 확인해 한 업무를 먼저 배치하고 대체 검토 가능성을 확인한다','둘 다 같은 시각에 배정하고 지연되면 처리한다','전문가의 검토를 생략한다','마감이 빠른 업무를 무조건 취소한다'],0,['의존관계와 소요시간을 확인해 순서를 조정하고 대체 자원 가능성을 검토해야 합니다.','동시 배정은 물리적으로 처리 불가능한 충돌을 만듭니다.','필수 검토를 생략하면 품질과 통제에 문제가 생길 수 있습니다.','취소는 목적과 영향 검토 없이 선택할 수 없습니다.']);
addExtra('자원관리능력','[자료해석] 프로젝트 기간을 10일에서 8일로 줄이면 원래 기간 대비 단축률은?',['20%','2%','25%','80%'],0,['2일 단축을 원래 10일로 나누면 20%입니다.','2일은 절대 단축일수이지 비율이 아닙니다.','2/8은 새 기간을 분모로 한 값이라 원래 기간 대비 단축률이 아닙니다.','8일은 남은 비율이지 단축률이 아닙니다.']);
addExtra('자원관리능력','[상황판단] 재료가 부족하지만 대체 재료가 일부 있다. 생산을 멈추지 않으면서 위험을 통제하려면?',['대체 재료의 규격 적합성을 확인하고 승인된 범위에서 우선순위 작업에 배정한다','외형이 같으면 모두 대체 가능하다고 본다','현재 재고를 숨기고 기존 계획을 유지한다','품질 확인 없이 전량 대체한다'],0,['대체품은 규격과 품질 적합성, 승인 조건을 확인해야 안전하게 활용할 수 있습니다.','외형만으로 성능이나 규격 적합성을 보장할 수 없습니다.','재고를 숨기면 조달과 생산 계획이 부정확해집니다.','전량 적용 전에 조건과 품질 위험을 검토해야 합니다.']);
addExtra('자원관리능력','[인적자원] 숙련자 한 명의 휴가가 예정되어 있다. 업무 연속성을 높이는 사전 조치는?',['핵심 업무와 판단 기준을 문서화하고 대체 담당자에게 인수인계한다','숙련자에게 휴가 중 연락을 계속 요청한다','업무를 모두 미루고 복귀를 기다린다','업무 내용을 알리지 않고 대체자를 지정한다'],0,['지식과 절차를 공유해 대체 담당자가 업무를 이어갈 수 있게 해야 합니다.','휴식권과 업무 연속성을 모두 해치며 구조적 대안이 아닙니다.','마감과 고객 영향이 생길 수 있습니다.','인수인계 없이 담당만 바꾸면 오류 위험이 높습니다.']);
addExtra('자원관리능력','[예산관리] 계획 대비 특정 항목의 집행률은 120%지만 전체 예산은 아직 남아 있다. 관리자의 적절한 판단은?',['항목 초과 원인과 다른 항목의 잔액 사용 가능 여부, 승인 절차를 확인한다','전체 잔액이 남았으므로 항목 초과를 무조건 허용한다','초과 항목을 기록에서 빼 전체 예산만 보고한다','다음부터 계획을 세우지 않는다'],0,['항목별 통제와 예산 변경 승인 조건을 확인해야 합니다.','총액 잔액이 있어도 항목 제한이나 승인 규정이 있을 수 있습니다.','기록 누락은 투명성과 통제를 해칩니다.','계획은 집행과 차이를 관리하는 기준입니다.']);
addExtra('자원관리능력','[자원관리] 한 장비의 수리기간이 불확실하다. 납기 위험을 낮추기 위한 계획은?',['수리 예상과 대체 장비 확보 가능성을 확인하고 필요한 경우 여유시간을 반영한다','수리 날짜를 확정된 것으로 간주한다','대체 장비를 검토하지 않고 작업을 시작한다','납기 지연 가능성을 공유하지 않는다'],0,['불확실성을 확인하고 대체 자원과 일정 여유를 함께 계획해야 합니다.','확정되지 않은 수리 일정을 사실처럼 취급하면 위험 대응이 어렵습니다.','대체 가능성을 미리 확인해야 대응 시간을 확보할 수 있습니다.','관련자에게 위험을 공유해야 일정 조정이 가능합니다.']);
addExtra('자원관리능력','[상황판단] 여러 과업이 동시에 마감된다. 우선순위 판단 기준으로 가장 적절한 조합은?',['기한·중요도·선후 의존성·미수행 영향','요청한 사람의 목소리 크기','시작하기 쉬운 정도만','업무를 받은 순서만'],0,['마감과 중요도, 다른 과업의 선행조건, 미수행 결과를 함께 고려해야 합니다.','목소리 크기는 과업의 조직상 중요성을 뜻하지 않습니다.','쉬운 일만 먼저 하면 중요한 기한을 놓칠 수 있습니다.','접수 순서만으로 긴급도와 의존성을 반영할 수 없습니다.']);
addExtra('자원관리능력','[자료해석] 팀 가용시간은 주 60시간이다. 확정 업무 42시간, 긴급 대응 예상 12시간, 새 과제 추정 10시간이다. 새 과제를 모두 수락할 수 있는가?',['아니요. 예상 총량 64시간으로 4시간이 초과된다','예. 확정 업무만 42시간이므로 충분하다','예. 긴급 대응은 계획에서 제외한다','아니요. 총량이 70시간이다'],0,['42+12+10=64시간으로 가용 60시간보다 4시간 많습니다.','확정 업무만 보고하면 예상 긴급 대응을 빠뜨립니다.','예상되는 긴급 수요도 현실적인 자원계획에 반영해야 합니다.','합계는 64시간이지 70시간이 아닙니다.']);
addExtra('자원관리능력','[상황판단] 작업 공간을 재배치하면 이동시간은 줄지만 안전 통로가 좁아질 수 있다. 결정 전 검토할 것은?',['작업 효율과 안전 기준을 함께 확인하고 규정에 맞는 배치를 설계한다','이동시간 절감만 계산한다','통로 폭은 현장에서 임의로 정한다','안전 검토는 배치 후 민원이 생기면 한다'],0,['효율 향상과 안전 요건은 함께 충족해야 하는 제약조건입니다.','효율만 최적화하면 안전 위험을 만들 수 있습니다.','통로 기준은 임의로 정할 수 없습니다.','예측 가능한 안전 위험은 실행 전에 검토해야 합니다.']);
addExtra('자원관리능력','[시간관리] 월말마다 같은 보고서 작성에 시간이 초과된다. 개선을 위한 자료 수집으로 적절한 것은?',['단계별 소요시간·재작업 원인·자료 대기시간을 기록해 반복 병목을 찾는다','다음 달에도 총 소요시간만 기억한다','작성자의 집중력 부족으로 원인을 확정한다','보고서 양식을 무조건 없앤다'],0,['과정별 시간과 지연 원인을 기록해야 개선 가능한 병목을 식별할 수 있습니다.','총량만으로 어느 단계가 지연되는지 알기 어렵습니다.','개인 요인만 단정하면 자료 대기나 양식 문제를 놓칠 수 있습니다.','양식이 통제나 품질에 필요할 수 있어 원인 확인 없이 제거하면 안 됩니다.']);
addExtra('자원관리능력','[개념비교] 예산·시간·장비·담당자를 먼저 파악한 뒤, 확보 가능한 자원과 활용 계획을 세웠다. 다음 단계는?',['계획에 따라 자원을 활용해 업무를 수행하고 차이를 관리한다','필요 자원 확인으로 돌아가 모든 계획을 폐기한다','목표와 무관하게 남은 자원을 먼저 소비한다','결과를 보기 전에 예산을 마감 처리한다'],0,['필요 확인, 확보, 활용계획 후에는 계획대로 수행하고 진행을 관리합니다.','상황 변화가 없다면 계획을 무조건 폐기할 이유가 없습니다.','자원은 목적과 우선순위에 맞춰 사용해야 합니다.','집행과 결과가 끝나기 전에 결산할 수 없습니다.']);
addExtra('정보능력','[정보판단] 보고서의 핵심 수치가 원자료와 다르다. 가장 적절한 조치는?',['원자료의 정의·기준시점·계산 과정을 대조하고 차이를 기록한다','보고서 수치를 직급이 높은 작성자가 썼으므로 채택한다','두 수치를 임의로 평균낸다','차이가 작아 보이면 출처 확인 없이 사용한다'],0,['원자료와 계산 기준을 확인해 차이를 설명하고 재현 가능하게 기록해야 합니다.','작성자의 직급은 수치 정확성의 근거가 아닙니다.','서로 다른 기준값의 평균은 오류를 감출 수 있습니다.','작은 차이도 의사결정 기준에 영향을 줄 수 있습니다.']);
addExtra('정보능력','[자료구분] 담당자가 직접 현장 계측을 한 결과와 그 결과를 요약한 연간 동향 보고서를 받았다. 자료 유형의 설명은?',['계측 원자료는 1차 자료, 요약 동향 보고서는 2차 자료일 수 있다','계측 결과는 2차 자료, 요약은 1차 자료다','둘 다 색인이다','둘 다 동적 정보라고만 구분하면 충분하다'],0,['직접 수집한 계측 결과는 1차 자료이고 요약·해설 보고서는 2차 자료일 수 있습니다.','원자료와 요약 자료의 관계가 뒤바뀌었습니다.','색인은 자료 내 위치를 찾게 하는 검색 도구입니다.','자료의 1차·2차 성격과 변화 속도는 서로 다른 구분 축입니다.']);
addExtra('정보능력','[정보관리] 프로젝트 자료를 연도별로 나눈 뒤, 각 연도 안에서 주제별로 분류했다. 이 방식의 이점은?',['시간과 주제라는 두 기준으로 검색 범위를 단계적으로 좁힐 수 있다','정보의 정확성이 자동으로 검증된다','원자료의 출처를 더는 기록할 필요가 없다','모든 자료가 최신 자료가 된다'],0,['일관된 다단계 분류는 원하는 정보를 찾는 범위를 좁히는 데 유용합니다.','분류는 정확성 검증을 대신하지 않습니다.','출처는 자료의 신뢰성을 판단하기 위해 여전히 필요합니다.','폴더 분류는 자료의 최신성을 보장하지 않습니다.']);
addExtra('정보능력','[상황판단] 온라인 통계에 표본 수가 매우 적고 조사 방법이 공개되지 않았다. 보고서 사용 전 판단은?',['한계를 확인하고 추가 출처와 방법론을 검토해 신뢰성을 판단한다','그래프가 보기 좋으므로 대표값으로 사용한다','표본 수는 결과와 무관하므로 무시한다','수치가 유리하면 출처를 생략한다'],0,['표본 크기와 조사 방법은 대표성과 신뢰성을 평가하는 중요한 조건입니다.','표현 방식이 자료의 신뢰도를 보장하지 않습니다.','표본 수와 추출 방식은 결과 해석에 영향을 줍니다.','유리한 수치라도 출처와 한계를 밝혀야 합니다.']);
addExtra('정보능력','[개념비교] 책의 서지사항은 정리했지만 특정 주제의 위치를 찾기 어렵다. 보완할 정보관리 도구는?',['주제어와 페이지를 연결한 색인','저자명만 포함한 목록','연도별 폴더','파일 확장자별 분류'],0,['주제어와 위치정보를 연결한 색인은 책 안의 내용을 빠르게 찾게 합니다.','서지 목록만으로 주제별 페이지 위치를 찾을 수 없습니다.','연도별 폴더는 책 내부 위치를 나타내지 않습니다.','파일 형식 분류는 주제어 탐색과 다릅니다.']);
addExtra('정보능력','[자료해석] 안내 방식 A와 B의 응답률을 비교한다. 공정한 비교를 위해 필요한 조건은?',['응답률의 분모·조사기간·대상 집단이 같은 기준인지 확인한다','응답 건수만 비교한다','더 큰 수치가 나온 방식을 선택한다','기간이 다르면 기간 정보를 숨긴다'],0,['분모와 기간, 대상이 같아야 비율 비교가 의미 있습니다.','대상 규모가 다르면 건수만으로 응답 성과를 비교할 수 없습니다.','수치가 큰 이유가 대상 수 차이일 수 있습니다.','기간 차이는 결과 해석에 공개해야 할 맥락입니다.']);
addExtra('정보능력','[정보검색] 검색 결과가 너무 많다. 원하는 것은 “올해 개정된 공식 제출 기준”이다. 검색 전략으로 적절한 것은?',['기관명·개정연도·제출 기준 같은 핵심어와 공식 출처 조건을 함께 사용한다','짧은 일반 검색어 하나만 반복한다','검색된 결과를 모두 저장한다','게시 날짜와 출처를 보지 않는다'],0,['주제와 시점, 공식성 조건을 구체화하면 관련 자료를 좁힐 수 있습니다.','일반어만 쓰면 관련 없는 결과가 많을 수 있습니다.','무차별 저장은 정보 과잉을 키웁니다.','개정 기준은 출처와 날짜가 핵심 검증 요소입니다.']);
addExtra('정보능력','[자료판단] 서로 다른 두 기관이 같은 지표를 발표했지만 정의가 다르다. 수치를 합쳐 하나의 값으로 만들기 전에?',['지표 정의와 산정 범위를 맞출 수 있는지 확인하고 불가능하면 구분해 제시한다','기관 명칭만 확인하고 합산한다','단위가 같으면 정의 차이를 무시한다','낮은 수치를 골라 안전하게 보인다'],0,['정의와 범위가 다르면 같은 지표처럼 합칠 수 없으므로 비교 가능성을 먼저 확인해야 합니다.','기관명만으로 산정 기준이 같다고 할 수 없습니다.','단위가 같아도 포함 대상과 정의가 다를 수 있습니다.','한쪽만 선택하는 것은 근거 없는 편향이 될 수 있습니다.']);
addExtra('정보능력','[정보관리] 공유 폴더에서 파일명이 “최종”, “최종2”, “진짜최종”으로 반복된다. 혼선을 줄이는 규칙은?',['파일명에 날짜·버전·작성 책임을 일관되게 표시하고 승인본 위치를 정한다','파일명을 더 짧게 줄인다','이전 파일을 모두 같은 이름으로 덮어쓴다','최종본 여부는 메신저 기억에 맡긴다'],0,['버전과 승인 상태, 책임을 일관되게 표시하면 최신본을 구별할 수 있습니다.','짧은 이름만으로 버전 혼동이 해결되지 않습니다.','덮어쓰기는 변경 이력과 복구 가능성을 없앨 수 있습니다.','기억에 맡기면 사용자마다 다른 파일을 사용할 수 있습니다.']);
addExtra('정보능력','[상황판단] 정책 뉴스는 최신이지만 공식 원문을 찾지 못했다. 의사결정에 사용하기 전 가장 적절한 행동은?',['공식 발표 원문과 시행일을 확인하고 보도 내용과 대조한다','최신 기사이므로 정책이 이미 시행됐다고 본다','기사 제목만 보고 업무 기준을 바꾼다','원문이 없으면 과거 기준을 영구 적용한다'],0,['공식 원문과 시행 시점을 확인해야 보도 요약의 정확성과 적용 여부를 판단할 수 있습니다.','발표와 시행은 시점이 다를 수 있습니다.','제목만으로 적용 대상과 조건을 확인할 수 없습니다.','원문 부재는 확인을 계속해야 한다는 뜻이지 과거 기준 고정 근거가 아닙니다.']);
addExtra('정보능력','[개념비교] 매일 바뀌는 환율 정보와 보관된 업무 매뉴얼의 정보 특성을 설명한 것은?',['환율은 동적 정보, 매뉴얼은 정적 정보일 수 있으나 개정 여부는 확인해야 한다','환율은 정적, 매뉴얼은 동적 정보다','문서 파일이면 모두 동적 정보다','정보의 저장 방식만으로 최신성이 결정된다'],0,['수시로 변하는 환율은 동적 정보이고 보관된 매뉴얼은 정적 정보일 수 있지만 개정 시점은 점검해야 합니다.','두 정보 유형이 반대로 설명되었습니다.','파일 형식은 정보의 변화 속성을 결정하지 않습니다.','저장 여부만으로 내용의 최신성을 알 수 없습니다.']);
addExtra('정보능력','[자료해석] 문의 건수는 전월 80건에서 이번 달 100건으로 늘었고, 고객 수는 800명에서 1,250명으로 늘었다. 문의율은?',['전월 10%, 이번 달 8%로 낮아졌다','전월 8%, 이번 달 10%로 높아졌다','두 달 모두 20%다','건수가 늘었으므로 문의율도 반드시 높아졌다'],0,['전월 80/800=10%, 이번 달 100/1250=8%입니다. 건수는 늘었지만 비율은 감소했습니다.','분모를 반대로 계산한 값입니다.','각 비율은 20%가 아닙니다.','건수 증가만으로 분모를 반영한 비율의 방향을 알 수 없습니다.']);
BANK.push(...EXTRA);
const KEY='ncsScenarioV1';let saved={done:{},wrong:[],score:0,attempts:0};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}let area='all',mode='all',items=[],idx=0;
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function updateStats(){const doneCount=Object.keys(saved.done||{}).length;$('#score').textContent=saved.score||0;$('#accuracy').textContent=saved.attempts?Math.round(100*(saved.score||0)/saved.attempts)+'%':'—';$('#remaining').textContent=items.length;$('#progressCount').textContent=(items.length?Math.min(idx+1,items.length):0)+' / '+items.length;$('#progressText').textContent=mode==='wrong'?'오답 복습 진행':(area==='all'?'전체 문제 진행':area+' 진행');$('#fill').style.width=(items.length?100*Math.min(idx,items.length)/items.length:0)+'%';$('#modeHint').textContent=mode==='wrong'?'틀린 문항을 다시 풀어 보세요. 정답을 맞히면 오답 목록에서 제외됩니다.':'누적 점수와 오답은 이 기기에 저장됩니다. 푼 문제를 다시 열면 이전 선택과 선지별 해설을 확인할 수 있습니다.'}
function setup(){const sel=$('#area');const current=sel.value||'all';sel.innerHTML='<option value="all">전체 영역</option>'+[...new Set(BANK.map(q=>q.a))].map(a=>'<option value="'+esc(a)+'">'+esc(a)+'</option>').join('');sel.value=current;area=current;mode=$('#mode').value||'all';items=BANK.map((q,i)=>({...q,id:i})).filter(q=>(area==='all'||q.a===area)&&(mode!=='wrong'||(saved.wrong||[]).includes(q.id)));idx=Math.min(idx,Math.max(0,items.length-1));updateStats();draw()}
function draw(){const box=$('#quiz');if(!items.length){box.innerHTML='<div class="empty"><b>복습할 오답이 없습니다.</b><p>틀린 문항을 모두 맞혔습니다. 전체 문제에서 계속 연습해 보세요.</p><button class="primary" id="showAll">전체 문제 보기</button></div>';$('#showAll')?.addEventListener('click',()=>{$('#mode').value='all';idx=0;setup()});return}const q=items[idx],record=saved.done[q.id],locked=!!record&&mode!=='wrong';box.innerHTML='<div class="qmeta"><span>'+esc(q.a)+'</span><span>문항 '+(idx+1)+' / '+items.length+'</span></div><div class="qtitle">'+esc(q.t)+'</div>'+(q.d?'<div class="data">'+q.d+'</div>':'')+'<div class="answers">'+q.o.map((x,j)=>'<button class="answer" data-i="'+j+'" '+(locked?'disabled':'')+'><span class="n">'+(j+1)+'</span><span>'+esc(x)+'</span></button>').join('')+'</div><div id="explain"></div><div class="actions"><button class="secondary" id="prev" '+(idx===0?'disabled':'')+'>이전</button><button class="primary" id="next">'+(idx===items.length-1?'마치기':'다음 문제')+'</button></div>';box.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>answer(q,+b.dataset.i)));if(record)showFeedback(q,record.choice);$('#prev').onclick=()=>{if(idx>0){idx--;draw()}};$('#next').onclick=()=>{if(idx<items.length-1){idx++;draw()}else{box.innerHTML='<div class="empty"><b>현재 범위의 문제를 확인했습니다.</b><p>정답 '+(saved.score||0)+'개 · 누적 정답률 '+(saved.attempts?Math.round(100*saved.score/saved.attempts):0)+'%</p><button class="primary" id="again">처음부터 다시 보기</button></div>';$('#again').onclick=()=>{idx=0;draw()}}};updateStats()}
function showFeedback(q,choice){const ok=choice===q.c;$('#explain').innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><div class="result '+(ok?'ok':'no')+'">'+(ok?'정답입니다!':'정답은 '+(q.c+1)+'번입니다.')+'</div><div class="explains">'+q.o.map((_,i)=>'<div class="explain"><b>'+ (i+1)+'번 '+(i===q.c?'· 정답':'')+'</b> '+esc(q.e[i])+'</div>').join('')+'</div></div>'}
function answer(q,choice){if(saved.done[q.id]&&mode!=='wrong')return;saved.done[q.id]={choice};saved.attempts=(saved.attempts||0)+1;if(choice===q.c){saved.score=(saved.score||0)+1;saved.wrong=(saved.wrong||[]).filter(id=>id!==q.id)}else if(!(saved.wrong||[]).includes(q.id)){saved.wrong.push(q.id)}persist();if(mode==='wrong')setup();else draw()}
$('#area').addEventListener('change',()=>{area=$('#area').value;idx=0;setup()});$('#mode').addEventListener('change',()=>{mode=$('#mode').value;idx=0;setup()});$('#reset').addEventListener('click',()=>{if(confirm('이 기기에 저장된 점수와 오답 기록을 모두 초기화할까요?')){saved={done:{},wrong:[],score:0,attempts:0};persist();idx=0;setup()}});setup();
</script></body></html>
